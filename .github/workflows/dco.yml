name: DCO

# Every commit in a pull request carries a Signed-off-by line matching its author
# (the Developer Certificate of Origin, see
# https://github.com/taiheiframework/.github/blob/main/CONTRIBUTING.md). Runs with read-only
# permissions and no secrets, so a pull request from a fork is safe to check.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dco:
    name: Signed-off-by on every commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The job only reads; the token need not stay in .git/config.
          persist-credentials: false
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$c")"
            # The whole line, exactly as git commit --signoff writes it: a match anywhere in
            # the body would let "Not-Signed-off-by: ..." or a quoted line pass.
            if ! git log -1 --format='%B' "$c" | grep -qxF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "Every commit is signed off."
