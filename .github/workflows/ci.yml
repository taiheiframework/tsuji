name: Taihei Tsuji CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Read-only: CI builds and tests, it publishes nothing.
permissions:
  contents: read

env:
  JAVA_VERSION: '25'
  NODE_VERSION: '24'
  # Everything resolves from Maven Central, then the family's repository: the build needs no
  # credentials.

jobs:
  validate:
    name: Validate (Format, Lint, Compile, Test, MiMa, JVM & JS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # The job only reads; the token need not stay in .git/config.
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Node (for Scala.js tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache Mill and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/mill
            ~/.ivy2/cache
            ~/.cache/coursier
          key: mill-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-${{ runner.os }}-

      # A symlink or a submodule is a tracked, clean entry to git, but Mill follows a symlink into
      # the published jars, wherever it points, and a filter (Git LFS) checks out other bytes than
      # the reviewed ones. The release refuses them (make's STRAY_GUARD); a pull request that adds
      # one fails here, visibly. This repository needs no .gitattributes, .lfsconfig or .gitmodules,
      # so any of them fails too. bash with pipefail, so a failing git cannot pass as "none found".
      - name: Refuse symlinks, submodules, filters and git attribute files
        shell: bash
        run: |
          git ls-files -s > "$RUNNER_TEMP/entries"
          links="$(awk '$1 != "100644" && $1 != "100755"' "$RUNNER_TEMP/entries")"
          if [ -n "$links" ]; then echo "::error::tracked entries that are not regular files:"; echo "$links"; exit 1; fi
          filtered="$(git ls-files | git check-attr --stdin filter | awk '!/: filter: unspecified$/')"
          if [ -n "$filtered" ]; then echo "::error::files with a git filter:"; echo "$filtered"; exit 1; fi
          attrs="$(git ls-files | awk '{ p = tolower($0) } p ~ /(^|\/)\.(gitattributes|lfsconfig|gitmodules)"?$/')"
          if [ -n "$attrs" ]; then echo "::error::tracked .gitattributes, .lfsconfig or .gitmodules:"; echo "$attrs"; exit 1; fi
          # A release bundle is built on the maintainer's machine, never committed.
          bundles="$(git ls-files -- .release-bundles .release-embargo .release-state.json)"
          if [ -n "$bundles" ]; then echo "::error::tracked release bundles or release state:"; echo "$bundles"; exit 1; fi

      # The build resolves from Maven Central first, then the family's repository (REPO_URL), and
      # from nothing else; every dev.taihei pin is a released version on one of them, and every
      # resolved dev.taihei file matches its immutable GitHub Release or its signature (ADR 0004).
      # This runner holds no credentials, which is the proof that the build needs none.
      - name: Maven Central and the family's repository only (repo-guard)
        run: make repo-guard

      # The release machinery against stand-ins on localhost: no token, no key, no upload.
      - name: Release machinery tests
        run: make release-test

      # As release-prepare runs them: its variables must not reach the make calls inside the test.
      - name: Release machinery tests, with the variables of a release-prepare
        run: make release-test TYPE=patch EMBARGO=0 VERSION=1.2.3

      - name: Check formatting
        run: ./mill __.checkFormat

      - name: Check linting (scalafix)
        run: ./mill __.fix --check

      - name: Compile all modules (JVM + JS)
        run: ./mill __.compile

      - name: Run all tests (JVM + JS)
        run: ./mill __.test.testForked

      # Against the newest v-tag before HEAD (fetch-depth 0 brings the tags), as make validate does.
      - name: Check binary compatibility (MiMa)
        run: make mima

  # Java 17 is the oldest Java the library supports. scalac already compiles the JVM modules
  # against the Java 17 API (-java-output-version:17); this job runs the JVM tests on a Java 17
  # runtime as well, where locale data and the JDK's behaviour can differ from the newest JDK.
  test-java-17:
    name: JVM tests on Java 17
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java 17
        id: java17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Mill and dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/mill
            ~/.ivy2/cache
            ~/.cache/coursier
          # A key of its own: this job fetches no Scala.js or Node artifacts, and a cache it saved
          # under the validate job's key would leave them out there.
          key: mill-java17-${{ runner.os }}-${{ hashFiles('build.mill', '.mill-version') }}
          restore-keys: |
            mill-java17-${{ runner.os }}-

      # Mill runs on its own JVM; TAIHEI_TEST_JAVA_HOME makes the test modules fork on Java 17.
      - name: Run the JVM tests on Java 17
        shell: bash
        env:
          TAIHEI_TEST_JAVA_HOME: ${{ steps.java17.outputs.path }}
        run: |
          set -euo pipefail
          "$TAIHEI_TEST_JAVA_HOME/bin/java" -version 2>&1 | tee "$RUNNER_TEMP/java-version"
          grep -q 'version "17\.' "$RUNNER_TEMP/java-version"
          ./mill show tsuji.jvm.test.javaHome | grep -qF "$TAIHEI_TEST_JAVA_HOME"
          ./mill tsuji.jvm.test.testForked + tsuji.tools.test.testForked
